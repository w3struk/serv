services:
    caddy:
        # pinned 2026-09-22: caddy 2.11.4 (latest stable 2.x), digest from Docker Hub library/caddy.
        image: caddy:2.11.4@sha256:040e9f7480b80b6d4a7e5013a21159b950a63dcbdb956e38abe2387fb28d9ec0
        container_name: caddy
        restart: always
        network_mode: host
        volumes:
            - ./caddy/data:/data
            - ./Caddyfile:/etc/caddy/Caddyfile

    3xui:
        # pinned 2026-09-22: 3x-ui v3.8.5 (matches external/3x-ui submodule), digest from ghcr API.
        image: ghcr.io/mhsanaei/3x-ui:v3.8.5@sha256:e0f90c10902e0e74f947d5a9efe017b273804477430233bbfc4918542ffe366c
        container_name: 3xui_app
        restart: unless-stopped
        network_mode: host
        volumes:
            - ./3x-ui/db/:/etc/x-ui/
        environment:
            XRAY_VMESS_AEAD_FORCED: "false"
            XUI_ENABLE_FAIL2BAN: "true"
        tty: true

    # Lampac media service (Lampa backend) — catch-all domain route via Caddy.
    # Built from the external/lampac fork submodule (github.com/w3struk/lampac)
    # at the pinned commit; the Telegram auth gate is config-driven via
    # LampaWeb.telegramAuthGate in init.conf (no vendored deny.js needed).
    # Container runs as uid/gid 1000; host paths under ./lampac must be owned 1000:1000.
    lampac:
        build:
            context: ./external/lampac
            dockerfile: Dockerfile
        image: lampac-fork:7307e6c
        container_name: lampac
        restart: unless-stopped
        network_mode: host
        shm_size: 1024mb
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./lampac/config/init.conf:/lampac/init.conf
            - ./lampac/config/passwd:/lampac/passwd
            - ./lampac/config/users.json:/lampac/users.json
            - ./lampac/database:/lampac/database
            - ./lampac/cache:/lampac/cache
            - ./lampac/mods:/lampac/mods
